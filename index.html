<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unterrichtsfluss analysieren</title>
<style>

:root{
  --green:#00883A; --green-dark:#006b2e; --green-soft:#e6f2ea; --ink:#1f2421; --muted:#5b625e;
  --line:#d7ddd9; --bg:#f6f7f6; --card:#ffffff; --warn:#a15c00; --warn-soft:#fff4e2; --blue:#2a5d9f; --blue-soft:#e8eef8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;font-size:16px}
header.top{background:var(--green);color:#fff;padding:18px 16px}
header.top .inner{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
header.top h1{margin:0;font-size:1.45rem;line-height:1.25}
header.top p{margin:4px 0 0;opacity:.9;font-size:.92rem}
.namebox{display:flex;flex-direction:column;gap:4px;font-size:.85rem;min-width:220px}
.namebox input{padding:8px 10px;border-radius:6px;border:0;font:inherit;font-size:.95rem}
.layout{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:230px 1fr;gap:20px}
nav.side{position:sticky;top:12px;align-self:start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
nav.side button{display:flex;width:100%;text-align:left;gap:8px;align-items:center;background:none;border:0;padding:9px 10px;border-radius:7px;font:inherit;font-size:.93rem;color:var(--ink);cursor:pointer}
nav.side button:hover{background:var(--bg)}
nav.side button.active{background:var(--green-soft);color:var(--green-dark);font-weight:600}
nav.side .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line);flex:none}
nav.side .dot.started{background:#f1c27d;border-color:#d99b3d}
nav.side .dot.done{background:var(--green);border-color:var(--green)}
nav.side hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:16px}
h2{margin:0 0 8px;font-size:1.3rem;color:var(--green-dark)}
h3{margin:18px 0 6px;font-size:1.05rem}
.kicker{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}
.situation p{margin:0 0 10px}
.hint{color:var(--muted);font-size:.9rem;margin:2px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.85rem;border:1px solid var(--line);background:#fff}
.chip.ok{background:var(--green-soft);border-color:#9fd0b2;color:var(--green-dark)}
.chip.miss{background:var(--blue-soft);border-color:#b8c9e6;color:var(--blue)}
.chip.extra{background:var(--warn-soft);border-color:#f0cf9a;color:var(--warn)}
label.field{display:block;font-weight:600;margin:16px 0 4px}
label.field span{display:block;font-weight:400;color:var(--muted);font-size:.88rem}
textarea{width:100%;min-height:110px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:.95rem;resize:vertical;background:#fff}
textarea:focus,input:focus{outline:2px solid var(--green);outline-offset:1px}
.impuls{background:var(--green-soft);border-left:4px solid var(--green);padding:10px 14px;border-radius:0 8px 8px 0;font-style:italic;margin:6px 0}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
button.btn{font:inherit;font-size:.95rem;padding:9px 16px;border-radius:7px;border:1px solid var(--green);background:var(--green);color:#fff;cursor:pointer}
button.btn:hover{background:var(--green-dark)}
button.btn.ghost{background:#fff;color:var(--green-dark)}
button.btn.ghost:hover{background:var(--green-soft)}
button.btn.danger{background:#fff;color:#a32d2d;border-color:#d9a3a3}
.reveal{border-top:1px dashed var(--line);margin-top:20px;padding-top:6px}
.reveal p{margin:0 0 10px}
.legend{font-size:.85rem;color:var(--muted)}
.status{font-size:.82rem;color:var(--muted);margin-top:10px}
table.over{width:100%;border-collapse:collapse;font-size:.92rem}
table.over th,table.over td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
table.over th{background:var(--green-soft)}
html{-webkit-text-size-adjust:100%}
button,.sec,input,textarea{-webkit-tap-highlight-color:rgba(0,136,58,.15)}
button.btn,nav.side button{min-height:44px}
textarea{overflow:hidden;min-height:110px;font-size:16px;font-weight:400}
#printArea{display:none}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:820px){
  .layout{grid-template-columns:1fr;padding:12px}
  nav.side{position:static;display:flex;overflow-x:auto;gap:4px;padding:6px}
  nav.side button{width:auto;white-space:nowrap;flex:none}
  nav.side hr{display:none}
  .card{padding:16px}
}
@media (min-width:821px) and (max-width:1100px){
  .layout{grid-template-columns:200px 1fr;gap:14px}
}
@media print{
  body{background:#fff}
  header.top,.layout,.toast{display:none!important}
  #printArea{display:block!important;font-size:11pt;color:#000}
  #printArea h1{color:#00883A;font-size:18pt;margin:0 0 4pt}
  #printArea h2{color:#00883A;font-size:14pt;margin:16pt 0 4pt;break-after:avoid}
  #printArea h3{font-size:11.5pt;margin:10pt 0 2pt;break-after:avoid}
  #printArea .txt{white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 6pt}
  #printArea .sit{color:#444}
  #printArea section{break-before:page}
  #printArea section:first-of-type{break-before:auto}
  @page{size:A4;margin:18mm}
}

.dimgroup{margin:10px 0 4px}
.dimgroup .gl{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.dimbtns{display:flex;flex-wrap:wrap;gap:8px}
button.dim{font:inherit;font-size:.93rem;min-height:44px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;text-align:left}
button.dim:hover{border-color:var(--green)}
button.dim[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
button.dim.cmp-ok{background:var(--green);border-color:var(--green);color:#fff}
button.dim.cmp-alt{background:var(--green-soft);border-color:#9fd0b2;color:var(--green-dark)}
button.dim.cmp-miss{background:var(--blue-soft);border-color:#b8c9e6;color:var(--blue)}
button.dim.cmp-extra{background:var(--warn-soft);border-color:#f0cf9a;color:var(--warn)}
.chip.alt{background:#f3faf5;border-color:#bfe0cb;color:var(--green-dark)}
.tag{display:inline-block;font-size:.78rem;padding:2px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:middle}
</style>
</head>
<body>
<header class="top"><div class="inner">
  <div>
    <h1>Unterrichtsfluss analysieren</h1>
    <p>Seminar Klassenführung · Fallarbeit zu Reibungslosigkeit und Schwung nach Kounin</p>
  </div>
  <label class="namebox">Ihr Name (erscheint im Download)
    <input id="name" type="text" autocomplete="name" placeholder="Vorname Nachname">
  </label>
</div></header>

<div class="layout">
  <nav class="side" id="nav" aria-label="Bereiche"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="printArea"></div>

<script>
const DATA = {"intro": ["Unterrichtsfluss wird vor allem dann sichtbar, wenn er unterbrochen wird. Kounin (1976) hat deshalb genau beobachtet, durch welches Verhalten Lehrkräfte Reibungslosigkeit und Schwung im Unterricht selbst stören. Die acht Fälle beruhen auf seinen Beispielen in der Darstellung von Haag (2018). Einige sind nah am Original, andere sind in Situationen mit digitalen Medien übertragen. Ein Fall zeigt ein gelungenes Beispiel."], "cases": [{"nr": 1, "title": "Das Update", "tag": "digital adaptiert", "situation": ["Frau Kraus erklärt ihrer 6. Klasse die Aufgaben, die gleich im digitalen Arbeitsheft auf den Tablets bearbeitet werden sollen. Mitten in der Erklärung erscheint auf dem interaktiven Display ein Fenster mit dem Hinweis auf ein Systemupdate.", "Frau Kraus hält inne, seufzt „Typisch, immer mitten in der Stunde“ und klickt sich durch die Einstellungen, um das Update zu verschieben. Dabei erzählt sie, dass das Display letzte Woche in einer anderen Klasse ganz ausgefallen sei. Einige Kinder berichten daraufhin von eigenen Erlebnissen mit Updates zuhause."], "dims": ["RA"], "alsoOk": ["UP"], "analysis": ["Der Fall zeigt Reizabhängigkeit. Der Auslöser kommt von außen, nämlich das Fenster auf dem Display. Frau Kraus greift ihn auf, kommentiert ihn und erzählt eine Geschichte dazu. Damit verschiebt sich die Aufmerksamkeit der Klasse von der Aufgabenerklärung auf das Nebenthema, und die Kinder steigen bereitwillig ein.", "Wer die Dauer der Abschweifung betont, kann zusätzlich von Überproblematisierung sprechen. Im Kern liegt aber eine Reaktion auf einen äußeren Reiz vor.", "Eine Alternative wäre, das Fenster wortlos zu schließen und die Erklärung fortzusetzen. Vorbeugend hilft eine Medienvorbereitung vor der Stunde, also Geräte prüfen und Updates außerhalb der Unterrichtszeit erledigen.", "Vorlage ist Kounins Beispiel des Papierschnipsels auf dem Boden, der während einer Aufgabenerklärung mehrere Bemerkungen und eine Inspektion des Fußbodens auslöst (Kounin, 1976, S. 107)."]}, {"nr": 2, "title": "Der leere Akku", "tag": "digital adaptiert", "situation": ["Die 7c arbeitet still an einer Übung auf den Tablets. Ein Schüler meldet sich und sagt leise, dass sein Akku leer ist. Herr Kaya geht zu ihm und fragt so laut, dass alle es hören: „Wann hast du es denn zuletzt geladen? Wo ist dein Ladekabel? Liegt das wieder zuhause? Und was machst du abends eigentlich mit dem Tablet, zockst du darauf?“", "Nach fast zwei Minuten holt er ein Ersatzgerät aus dem Schrank. Mehrere Mitschülerinnen und Mitschüler haben inzwischen ihre Arbeit unterbrochen und hören zu."], "dims": ["UP"], "alsoOk": [], "analysis": ["Der Fall zeigt Überproblematisierung und betrifft damit den Schwung. Herr Kaya beschäftigt sich weit länger als nötig mit einem Arbeitsmittel und dem Verhalten eines einzelnen Schülers. Das eigentliche Problem wäre mit einem Ersatzgerät in wenigen Sekunden gelöst.", "Weil er laut spricht, verliert nicht nur der Schüler, sondern die ganze Klasse Lernzeit. Die Ermahnung wirkt zudem bloßstellend.", "Eine Alternative wäre, das Ersatzgerät wortlos auszugeben und die Frage nach dem Laden später unter vier Augen zu klären. Vorbeugend hilft eine Routine für leere Akkus, etwa eine Ladestation oder feste Leihgeräte.", "Vorlage ist Kounins Beispiel des verlorenen Bleistifts, zu dem die Lehrkraft während der Stillarbeit eine lange Reihe von Fragen stellt (Kounin, 1976, S. 111)."]}, {"nr": 3, "title": "Auf dem Weg zur Tafel", "tag": "nach Kounin", "situation": ["Frau Berger möchte die Lösungen der Hausaufgabe an der Tafel erklären und geht dazu nach vorn. Auf halbem Weg bleibt sie stehen, dreht sich um und geht zum Pult. Dort blättert sie in ihren Aufzeichnungen und trägt in Ruhe noch etwas in ihren Kalender ein.", "Die Klasse wartet, einige beginnen sich zu unterhalten. Nach einigen Minuten legt Frau Berger die Unterlagen beiseite, geht zur Tafel und beginnt mit der Erklärung der Hausaufgabe."], "dims": ["TI"], "alsoOk": ["UV"], "analysis": ["Der Fall zeigt thematische Inkonsequenz. Frau Berger beginnt eine Tätigkeit, lässt sie unkommentiert stehen, wendet sich etwas anderem zu und kehrt danach zur ursprünglichen Tätigkeit zurück. Typisch ist die Wartezeit, in der die Klasse ohne Auftrag bleibt.", "Weil der Anstoß von der Lehrkraft selbst kommt, ist auch der Bezug zur Unvermitteltheit nachvollziehbar. Entscheidend ist hier aber das Muster aus Abbrechen und späterem Zurückkehren.", "Eine Alternative wäre, die Erklärung zuerst abzuschließen und Verwaltungsaufgaben in eine Stillarbeitsphase oder die Pause zu legen. Hilfreich ist auch, sich vor der Stunde einen Merkzettel für solche Einfälle bereitzulegen.", "Vorlage ist Kounins Beispiel der Lehrkraft, die auf dem Weg zur Tafel umkehrt und am Pult ihre Aufzeichnungen durchsieht (Kounin, 1976, S. 109)."]}, {"nr": 4, "title": "Die Frage nach der KI", "tag": "digital adaptiert", "situation": ["Frau Meier übt mit ihrer 9. Klasse, wie man eigene Texte formal und sprachlich überarbeitet. Eine Schülerin fragt, ob man Texte heute nicht einfach von einer KI korrigieren lassen könne. Mehrere Jugendliche nicken, die Frage interessiert offensichtlich viele, und Frau Meier hätte selbst Lust, darauf einzugehen.", "Sie antwortet: „Das ist eine gute Frage, und die schauen wir uns am Donnerstag genauer an.“ Dann notiert sie die Frage im digitalen Themenspeicher am Board und lässt die Klasse mit der Überarbeitung ihrer Texte weitermachen."], "dims": ["GL"], "alsoOk": [], "analysis": ["Der Fall ist ein gelungenes Beispiel für Reibungslosigkeit und Schwung. Frau Meier nimmt einen attraktiven Ablenkungsreiz wahr, lässt sich aber nicht vom Ziel der Stunde abbringen. Damit vermeidet sie sowohl Reizabhängigkeit als auch eine thematische Inkonsequenz durch einen langen Exkurs.", "Zugleich würdigt sie die Frage und macht durch den Themenspeicher transparent, dass sie nicht verloren geht. Das schafft Orientierungssicherheit und hält die Beziehung zur Klasse positiv.", "Vorlage ist Kounins Beispiel der Lehrkraft, die bemerkt, dass ihre Zusatzerklärungen zu weit vom Thema abführen, und beschließt, sie später einzubringen (Kounin, 1976, dargestellt bei Haag, 2018)."]}, {"nr": 5, "title": "Die digitale Pinnwand", "tag": "digital adaptiert", "situation": ["In einer 5. Klasse haben die Kinder im Englischunterricht auf einer digitalen Pinnwand kurze Beiträge zu ihren Einkaufserlebnissen gepostet. Herr Schulz ruft die Pinnwand am Board auf, und eine Schülerin liest ihren Beitrag vor.", "Direkt danach wechselt Herr Schulz zur nächsten Folie und stellt die neuen Vokabeln für die kommende Lektion vor. Mehrere Kinder, die sich gemeldet haben, nehmen die Hand wieder herunter. Die Pinnwand wird weder in dieser noch in der nächsten Stunde wieder aufgerufen."], "dims": ["VK"], "alsoOk": [], "analysis": ["Der Fall zeigt eine Verkürzung. Eine begonnene Tätigkeit wird unkommentiert stehengelassen, es wird zu neuem Stoff gewechselt, und die ursprüngliche Tätigkeit wird nicht weiterbehandelt. Anders als bei der thematischen Inkonsequenz fehlt die Rückkehr.", "Für die Lernenden ist das doppelt ungünstig. Ihre Beiträge bleiben ohne Würdigung, und der Sinn der Aufgabe wird nachträglich in Frage gestellt.", "Eine Alternative wäre, für die Besprechung Zeit einzuplanen, zum Beispiel mit einer Auswahl von drei Beiträgen. Reicht die Zeit nicht, sollte die Lehrkraft das ausdrücklich ankündigen und die Pinnwand als Einstieg der nächsten Stunde nutzen.", "Vorlage ist Kounins Beispiel der Kinder, die von Einkaufserlebnissen berichten sollen, während sich die Lehrkraft nach dem ersten Beitrag der Tafel und neuen Wörtern zuwendet (Kounin, 1976, S. 107)."]}, {"nr": 6, "title": "Die Abgabe", "tag": "digital adaptiert", "situation": ["Die 8b arbeitet seit zehn Minuten konzentriert an einer Textanalyse. Herr Yilmaz sitzt am Pult und pflegt nebenbei den Kurs auf der Lernplattform. Dabei fällt ihm ein, dass er die Abgabe für das Projekt noch nicht angekündigt hat.", "Er steht auf und ruft in den Raum: „Alle mal kurz herhören! Ich habe gerade die Abgabe fürs Projekt freigeschaltet. Frist ist Freitag, und bitte als PDF hochladen, nicht als Foto!“ Sofort fragen mehrere, ob auch Word-Dateien gehen und ob Gruppen eine gemeinsame Abgabe machen dürfen."], "dims": ["UV"], "alsoOk": [], "analysis": ["Der Fall zeigt Unvermitteltheit. Der Anstoß geht von der Lehrkraft selbst aus. Herr Yilmaz platzt mit einem eigenen Anliegen in eine laufende Arbeitsphase, ohne darauf zu achten, ob die Klasse dafür bereit ist. Die Nachfragen verlängern die Unterbrechung zusätzlich.", "Eine Alternative wäre, die Information zu notieren und am Ende der Arbeitsphase oder der Stunde zu geben. Ebenso möglich ist eine schriftliche Ankündigung auf der Lernplattform mit allen Details, auf die er kurz verweist.", "Vorlage ist Kounins Unterscheidung, nach der bei der Unvermitteltheit der Reiz nicht von außen, sondern von der Lehrkraft selbst ausgeht (Kounin, 1976, dargestellt bei Haag, 2018)."]}, {"nr": 7, "title": "Hefte weg, Hefte her", "tag": "nach Kounin", "situation": ["Frau Novak bittet ihre 4. Klasse, die Rechtschreibhefte wegzupacken und die Mathebücher herauszulegen. Es dauert eine Weile, bis alle Hefte verstaut und die Bücher auf der richtigen Seite aufgeschlagen sind.", "Als endlich alle bereit sind, sagt Frau Novak: „Ach, wartet, holt die Rechtschreibhefte nochmal raus. Schreibt unter die Übung noch die drei Wörter, die euch am schwersten gefallen sind.“"], "dims": ["TU"], "alsoOk": [], "analysis": ["Der Fall zeigt thematische Unentschlossenheit. Frau Novak beendet eine Tätigkeit, leitet eine neue ein und kommt dann auf die ursprüngliche Tätigkeit zurück. Der Wechsel kostet doppelt Zeit, weil alle Materialien zweimal bewegt werden.", "Im Unterschied zur thematischen Inkonsequenz ist die erste Tätigkeit hier bereits abgeschlossen. Die Lehrkraft springt also zu etwas zurück, das schon beendet war.", "Eine Alternative wäre, den Reflexionsauftrag ans Ende der Rechtschreibphase zu legen und erst danach zu wechseln. Ein kurzer Blick auf die eigene Stundenplanung vor jedem Übergang hilft dabei, ebenso eine feste Abschlussfrage am Ende jeder Phase.", "Vorlage ist Kounins Beispiel der Lehrkraft, die nach dem Wechsel von Rechtschreib- zu Rechensachen noch einmal auf die Rechtschreibübung zurückkommt (Kounin, 1976, S. 109)."]}, {"nr": 8, "title": "Die Zugangscodes", "tag": "digital adaptiert", "situation": ["Für eine Onlinerecherche braucht jede Schülerin und jeder Schüler der 10a einen persönlichen Zugangscode. Herr Brandt ruft die Jugendlichen einzeln ans Pult: „Ahmet, du zuerst. Gut, jetzt Lea. Dann Jonas …“ Er reicht jeweils einen Zettel mit dem Code und wartet, bis die Anmeldung am Gerät geklappt hat.", "Die übrigen sitzen ohne Auftrag auf ihren Plätzen und warten. Nach gut fünfzehn Minuten sind alle angemeldet, und die Recherche beginnt."], "dims": ["FR"], "alsoOk": [], "analysis": ["Der Fall zeigt Fragmentierung und betrifft damit den Schwung. Herr Brandt lässt eine Handlung, die die Gruppe gemeinsam erledigen könnte, in Einzelaktionen zerfallen. Jede Person kommt nacheinander an die Reihe, und die übrigen haben in dieser Zeit nichts zu tun.", "Eine Alternative wäre, die Codes vorab auszuteilen, etwa als Liste oder auf Kärtchen am Platz, damit sich alle gleichzeitig anmelden. Wer früher fertig ist, bekommt einen Anschlussauftrag. Probleme bei einzelnen Anmeldungen löst die Lehrkraft danach gezielt.", "Vorlage ist Kounins Beispiel der Lehrkraft, die eine Gruppe von zehn Kindern einzeln nacheinander ihren Platz wechseln lässt (Kounin, 1976, S. 113 ff.)."]}]};

const DIMS = {
  RA:{name:"Reizabhängigkeit", group:"R", desc:"Die Lehrkraft reagiert auf einen äußeren Reiz und lässt sich davon von der laufenden Tätigkeit ablenken."},
  UV:{name:"Unvermitteltheit", group:"R", desc:"Der Reiz geht von der Lehrkraft selbst aus. Sie platzt mit einem eigenen Anliegen in eine laufende Tätigkeit, ohne auf die Bereitschaft der Klasse zu achten."},
  TI:{name:"Thematische Inkonsequenz", group:"R", desc:"Behandelter Stoff wird unkommentiert stehengelassen, es wird zu Neuem gewechselt und danach der ursprüngliche Stoff weiterbehandelt."},
  VK:{name:"Verkürzung", group:"R", desc:"Behandelter Stoff wird unkommentiert stehengelassen, es wird zu Neuem gewechselt, und der ursprüngliche Stoff wird nicht weiterbehandelt."},
  TU:{name:"Thematische Unentschlossenheit", group:"R", desc:"Die Lehrkraft beendet eine Tätigkeit, beginnt eine neue und kommt dann auf die ursprüngliche Tätigkeit zurück."},
  UP:{name:"Überproblematisierung", group:"S", desc:"Die Lehrkraft verlangsamt den Arbeitsprozess, weil sie sich länger als nötig mit Benehmen, Verhaltensdetails, Arbeitsmitteln oder Lehrstoff aufhält."},
  FR:{name:"Fragmentierung", group:"S", desc:"Die Lehrkraft lässt eine Einheit zerfallen, indem sie Gruppenmitglieder einzeln nacheinander handeln lässt oder Handlungen in unnötige Einzelschritte zerlegt."},
  GL:{name:"Gelungenes Beispiel", group:"G", desc:"Die Lehrkraft nimmt einen möglichen Störreiz wahr, lässt sich aber nicht vom Ziel abbringen und hält den Fluss aufrecht."}
};
const ORDER = ["RA","UV","TI","VK","TU","UP","FR","GL"];
const GROUPS = [["R","Reibungslosigkeit (Gegenteil Sprunghaftigkeit)"],["S","Schwung (Gegenteil Verzögerungen)"],["G","Kein Bruch im Fluss"]];

const FIELDS = [
  {key:"obs", label:"Beobachtbares Verhalten", help:"Was tut oder sagt die Lehrkraft genau, und was geschieht dadurch mit dem Unterrichtsfluss?"},
  {key:"assign", label:"Zuordnung und Begründung", help:"Welcher Dimension ordnen Sie das Verhalten zu? Begründen Sie mit den Merkmalen der Dimension."},
  {key:"alt", label:"Alternative Handlung", help:"Wie könnte die Lehrkraft handeln, damit der Fluss erhalten bleibt? Beziehen Sie strukturierende Handlungen ein.",
   helpGood:"Welche strukturierende Handlung zeigt die Lehrkraft, und was wäre ohne sie vermutlich passiert?"}
];

/* ---------- state ---------- */
const STORE_KEY = "unterrichtsfluss-uebung-v1";
function emptyEntry(){ return {dims:[], obs:"", assign:"", alt:"", revealed:false}; }
function freshState(){
  const s = {name:"", cases:{}, own:Object.assign(emptyEntry(), {title:"", situation:""}), view:"intro"};
  DATA.cases.forEach(c => s.cases[c.nr] = emptyEntry());
  return s;
}
let state = freshState();
try{ const raw = localStorage.getItem(STORE_KEY); if(raw){ mergeState(JSON.parse(raw)); } }catch(e){}
function mergeState(obj){
  if(!obj || typeof obj!=="object") return;
  const base = freshState();
  base.name = typeof obj.name==="string" ? obj.name : "";
  if(obj.cases) for(const k in base.cases){ if(obj.cases[k]) base.cases[k] = Object.assign(emptyEntry(), obj.cases[k]); }
  if(obj.own) base.own = Object.assign(base.own, obj.own);
  if(obj.view) base.view = obj.view;
  state = base;
}
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{

function progress(e){

let docxLoading=null;
function loadDocx(){
  if(window.docx) return Promise.resolve(window.docx);

async function downloadWord(includeModel){
  const secs = collectSections(includeModel);
  try{
    const D = await loadDocx();
    const {Document,Packer,Paragraph,TextRun,HeadingLevel} = D;
    const F="Calibri";
    const para=(t,o={})=>String(t||"").split(/\n/).map(line=>new Paragraph({spacing:{after:120,line:300}, children:[new TextRun(Object.assign({text:line,font:F,size:22},o))]}));
    const head=(t,l)=>new Paragraph({heading:l, keepNext:true, spacing:{before:240,after:100}, children:[new TextRun({text:t,font:F})]});
    const ch=[];
    ch.push(new Paragraph({heading:HeadingLevel.TITLE, children:[new TextRun({text:TITLE,font:F})]}));
    ch.push(...para(`Seminar Klassenführung · ${state.name.trim()||"ohne Namen"} · ${today()}`,{color:"555555",size:20}));
    secs.forEach(s=>{
      ch.push(head(s.title, HeadingLevel.HEADING_1));
      ch.push(head("Situation", HeadingLevel.HEADING_2));
      s.situation.forEach(p=>ch.push(...para(p,{color:"444444"})));
      ch.push(head("Gewählte Dimension", HeadingLevel.HEADING_2));
      ch.push(...para(dimLine(s.dims)));
      s.fields.forEach(f=>{ ch.push(head(f.label, HeadingLevel.HEADING_2)); ch.push(...para(f.text.trim()||"(nicht bearbeitet)", f.text.trim()?{}:{italics:true,color:"888888"})); });
      if(s.model){ ch.push(head("Musterlösung zum Vergleich", HeadingLevel.HEADING_2)); ch.push(...para(modelLine(s.model),{bold:true})); s.model.analysis.forEach(p=>ch.push(...para(p,{color:"444444"}))); }
    });
    const doc = new Document({
      styles:{paragraphStyles:[
        {id:"Heading1",name:"Heading 1",basedOn:"Normal",next:"Normal",quickFormat:true,run:{size:30,bold:true,color:"00883A",font:F},paragraph:{outlineLevel:0}},
        {id:"Heading2",name:"Heading 2",basedOn:"Normal",next:"Normal",quickFormat:true,run:{size:23,bold:true,color:"333333",font:F},paragraph:{outlineLevel:1}},
        {id:"Title",name:"Title",basedOn:"Normal",next:"Normal",run:{size:40,bold:true,color:"00883A",font:F}}
      ]},
      sections:[{properties:{page:{margin:{top:1300,bottom:1300,left:1440,right:1440}}}, children:ch}]
    });
    const blob = await Packer.toBlob(doc);
    saveBlob(blob, fileBase()+".docx"); toast("Word-Datei erstellt");
  }catch(err){
    let h = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>Fallanalyse</title>
      <style>body{font-family:Calibri,Arial;font-size:11pt}h1{color:#00883A}h2{color:#00883A;margin-top:18pt}h3{font-size:12pt}</style></head><body>`;
    h += `<h1>${TITLE}</h1><p>Seminar Klassenführung · ${esc(state.name.trim()||"ohne Namen")} · ${today()}</p>`;
    secs.forEach(s=>{
      h += `<h2>${esc(s.title)}</h2><h3>Situation</h3>${s.situation.map(p=>`<p>${esc(p)}</p>`).join("")}<h3>Gewählte Dimension</h3><p>${esc(dimLine(s.dims))}</p>`;
      s.fields.forEach(f=>{ h+=`<h3>${esc(f.label)}</h3><p>${esc(f.text.trim()||"(nicht bearbeitet)").replace(/\n/g,"<br>")}</p>`; });
      if(s.model) h+=`<h3>Musterlösung zum Vergleich</h3><p><b>${esc(modelLine(s.model))}</b></p>${s.model.analysis.map(p=>`<p>${esc(p)}</p>`).join("")}`;
    });
    h += `</body></html>`;
    saveBlob(new Blob(["﻿"+h],{type:"application/msword"}), fileBase()+".doc");
    toast("Word-Datei im Kompatibilitätsformat erstellt");
  }
}

const CP1252 = "€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ";
function pdfSafe(s){
  return String(s||"").replace(/\r/g,"").replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]️?/g,"").replace(/️/g,"").replace(/\t/g,"    ").replace(/[^\n\x20-\x7E\xA0-\xFF]/g, ch=>CP1252.includes(ch)?ch:"?");
}
async function downloadPdf(includeModel){
  const secs = collectSections(includeModel);
  let JsPDF;
  try{ JsPDF = await loadPdfLib(); } catch(e){ printFallback(secs); return; }
  const doc = new JsPDF({unit:"mm", format:"a4"});
  const M=20, W=210-2*M, BOTTOM=297-20;
  let y=M;
  const GREEN=[0,136,58], INK=[31,36,33], GREY=[85,85,85], LIGHT=[136,136,136];
  const lh = size => size*0.3528*1.38;
  function ensure(h){ if(y+h>BOTTOM){ doc.addPage(); y=M; } }
  function write(str, o={}){
    const size=o.size||10.5, style=o.style||"normal";
    doc.setFont("helvetica", style); doc.setFontSize(size); doc.setTextColor(...(o.color||INK));
    const lines = doc.splitTextToSize(pdfSafe(str), o.width||W);
    lines.forEach(line=>{ ensure(lh(size)); doc.text(line, o.x||M, y+lh(size)*0.78); y+=lh(size); });
    y += (o.after==null?2:o.after);
  }
  function heading(t, level){
    const size = level===1?15:11.5;
    ensure(lh(size)+(level===1?14:10));
    y += level===1?4:2;
    write(t,{size, style:"bold", color: level===1?GREEN:INK, after:1});
  }
  function block(label, text){ heading(label,2); const t=(text||"").trim(); if(t) write(t); else write("(nicht bearbeitet)",{style:"italic",color:LIGHT}); }
  write(TITLE,{size:20,style:"bold",color:GREEN,after:1});
  write(`Seminar Klassenführung · ${state.name.trim()||"ohne Namen"} · ${today()}`,{size:10,color:GREY,after:4});
  secs.forEach((s,i)=>{
    if(i>0){ doc.addPage(); y=M; }
    heading(s.title,1);
    heading("Situation",2);
    if(s.situation.length) s.situation.forEach(p=>write(p,{color:GREY})); else write("(keine Situation beschrieben)",{style:"italic",color:LIGHT});
    heading("Gewählte Dimension",2);
    if(s.dims.length) write(dimLine(s.dims)); else write("keine Auswahl",{style:"italic",color:LIGHT});
    s.fields.forEach(f=>block(f.label, f.text));
    if(s.model){ heading("Musterlösung zum Vergleich",2); write(modelLine(s.model),{style:"bold",size:10}); s.model.analysis.forEach(p=>write(p,{color:GREY})); }
  });
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){
    doc.setPage(i); doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(...LIGHT);
    doc.text(pdfSafe(`${TITLE} · ${state.name.trim()||"ohne Namen"}`), M, 297-10);
    doc.text(`Seite ${i} von ${n}`, 210-M, 297-10, {align:"right"});
  }
  saveBlob(doc.output("blob"), fileBase()+".pdf");
  toast("PDF erstellt");
}
function printFallback(secs){
  const box = document.getElementById("printArea");
  let h = `<h1>${TITLE}</h1><p>Seminar Klassenführung · ${esc(state.name.trim()||"ohne Namen")} · ${today()}</p>`;
  const t = s => `<p class="txt">${esc((s||"").trim()||"(nicht bearbeitet)")}</p>`;
  secs.forEach(s=>{
    h += `<section><h2>${esc(s.title)}</h2><h3>Situation</h3>${s.situation.map(p=>`<p class="txt sit">${esc(p)}</p>`).join("")}`;
    h += `<h3>Gewählte Dimension</h3><p class="txt">${esc(dimLine(s.dims))}</p>`;
    s.fields.forEach(f=>{ h += `<h3>${esc(f.label)}</h3>${t(f.text)}`; });
    if(s.model) h += `<h3>Musterlösung zum Vergleich</h3><p class="txt"><b>${esc(modelLine(s.model))}</b></p>${s.model.analysis.map(p=>`<p class="txt sit">${esc(p)}</p>`).join("")}`;
    h += `</section>`;
  });
  box.innerHTML = h;
  alert("Ohne Internetverbindung öffnet sich der Druckdialog. Wählen Sie dort als Ziel „Als PDF speichern“.");
  window.print();
}

/* ---------- init ---------- */
const nameIn = $("#name");
nameIn.value = state.name;
nameIn.addEventListener("input", ()=>{ state.name = nameIn.value; save(); });
render();
</script>
